# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
highlight_theme: github  # https://github.com/jwarby/jekyll-pygments-themes
kramdown:
  math_engine: mathjax
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ['_pages']
exclude:
  - vendor
  - bin
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: "googlefcd80bd2372054d6.html"
    values:
      sitemap: false

# kramdown:
#   math_engine: mathjax

#math_engine: null

# Plug-ins
plugins:
  - jekyll-email-protect
  - jekyll-sitemap
  - jemoji

- id: compressible
  title: Compressible flows and shock waves
  description: High-speed flows with shocks, contact discontinuities, and complex wave interactions.
  simulations:
    - title: Explosion in a closed domain
      description: A strong circular shock interacts repeatedly with internal cylinders and the outer wall.
      image: /assets/arts/explosion/b_den_t_2_713.png
      href: /projects/euler/#closed-domain-explosion
      video: https://www.youtube.com/watch?v=Pmc5usZVyfY
      tags: [Euler equations, Entropy viscosity, High-order FEM]
    - title: Mach 10 double-Mach reflection
      description: Shock reflection and fine-scale structures in a high-Mach-number wind tunnel.
      image: /assets/arts/mach10/mach10_rho_0.0025.png
      href: /projects/euler/#double-mach-reflection
      video: https://www.youtube.com/watch?v=BlFsRtSEnK4
      tags: [Compressible flow, Shock capturing, Unstructured mesh]
    - title: Supersonic flow around a cylinder
      description: Bow shocks, reflected waves, separation, and vortical structures downstream of a cylinder.
      image: /assets/arts/cyl/cyl_366746_nodes_crop.png
      href: /projects/invariant/#supersonic-cylinder
      video: https://www.youtube.com/watch?v=1bI4BIIa8Zc
      tags: [Invariant domains, Convex limiting, Euler equations]
    - title: Circular Riemann problem
      description: An expanding shock, contact discontinuity, and rarefaction generated by radial initial data.
      image: /assets/arts/expl/expl3.jpg
      href: /projects/euler/#circular-riemann-problem
      video: https://www.youtube.com/watch?v=n_KYucSSInY
      tags: [Conservation laws, Residual viscosity, Finite elements]
    - title: Implosion problem
      description: Interacting shocks produced by low-density, low-pressure gas inside a diamond-shaped region.
      image: /assets/arts/impl/impl3.jpg
      href: /projects/euler/#implosion-problem
      video: https://www.youtube.com/watch?v=CnwEnhA9Cic
      tags: [Euler equations, Nonlinear stabilization, Riemann problem]

- id: incompressible
  title: Incompressible and variable-density flows
  description: Turbulent and stratified flows computed with stabilized continuous finite element methods.
  simulations:
    - title: Turbulent flow around a car
      description: Implicit large-eddy simulation of the turbulent wake behind a full Volvo car geometry.
      image: /assets/img/simulations/volvo-flow.jpg
      href: /projects/nse/#volvo-car-flow
      video: https://www.youtube.com/watch?v=HTOl0lTet9A
      tags: [Navier–Stokes, ILES, Adaptive FEM]
    - title: Variable-density lock exchange
      description: Density, vorticity, and artificial viscosity in a gravity-driven lock-exchange flow.
      image: /assets/arts/var_den/var_den_t_20_640x80.png
      href: /projects/nse/#variable-density-flow
      tags: [Variable density, Residual viscosity, Incompressible flow]

- id: geophysical
  title: Geophysical and atmospheric flows
  description: Surface quasi-geostrophic simulations of vortex interactions and multiscale turbulence.
  simulations:
    - title: Freely decaying SQG turbulence
      description: Starting from noisy buoyancy data, small vortices emerge, interact, and merge into larger coherent structures.
      image: /assets/img/simulations/sqg-decaying-turbulence.jpg
      href: https://doi.org/10.1137/20M1342616
      external: true
      link_label: Related publication
      video: /assets/videos/simulations/sqg-decaying-turbulence.mp4
      video_local: true
      tags: [Surface quasi-geostrophic flow, Turbulence, Entropy viscosity]
    - title: Double-vortex SQG interaction
      description: Two rotating vortices generate a sharp filamentary layer while remaining distinct over long times.
      image: /assets/img/simulations/sqg-double-vortex.jpg
      href: https://doi.org/10.1137/20M1342616
      external: true
      link_label: Related publication
      video: /assets/videos/simulations/sqg-double-vortex.mp4
      video_local: true
      tags: [Vortex dynamics, Fractional diffusion, Flux-corrected transport]

- id: mhd
  title: Magnetohydrodynamics and fusion plasmas
  description: Structure-preserving simulations of strongly magnetized, compressible flows.
  simulations:
    - title: Orszag–Tang vortex
      description: Density evolution in a canonical MHD benchmark with interacting shocks and vortical structures.
      image: /assets/img/simulations/orszag-tang-density.jpg
      href: https://doi.org/10.1007/s10915-022-01918-4
      external: true
      link_label: Related publication
      video: /assets/videos/simulations/orszag-tang-density.mp4
      video_local: true
      tags: [Ideal MHD, Entropy viscosity, High-order FEM]
    - title: Astrophysical MHD jet
      description: A Mach 800 magnetized jet propagating into an ambient fluid under a strong background field.
      image: /assets/img/simulations/astrophysical-mhd-jet.jpg
      href: https://doi.org/10.1016/j.jcp.2024.113009
      external: true
      link_label: Related publication
      video: /assets/videos/simulations/astrophysical-mhd-jet.mp4
      video_local: true
      tags: [Compressible MHD, Positivity preservation, Astrophysical flow]

- id: kinetic
  title: Kinetic plasma simulations
  description: Phase-space dynamics computed with stabilized and positivity-preserving Vlasov solvers.
  simulations:
    - title: Bump-on-tail instability
      description: Nonlinear phase-space vortices generated by a fast particle population interacting with a plasma wave.
      image: /assets/img/simulations/bump-on-tail.png
      href: https://doi.org/10.1016/j.jcp.2025.114079
      external: true
      link_label: Related publication
      tags: [Vlasov–Poisson, Phase space, Nonlinear stabilization]
    - title: Multi-vortex two-stream instability
      description: Fine vortex structures produced by counter-streaming particle populations while preserving positivity.
      image: /assets/img/simulations/multi-vortex-two-stream.png
      href: https://doi.org/10.1016/j.jcp.2025.114079
      external: true
      link_label: Related publication
      tags: [Vlasov–Poisson, Positivity, High-order FEM]

- id: multiphysics
  title: Multiphysics and other PDE models
  description: Numerical experiments beyond classical fluid dynamics, including moving interfaces and solidification.
  simulations:
    - title: Isotropic phase-field solidification
      description: Phase-field evolution for the solidification of water on a million-node finite element mesh.
      image: /assets/arts/phase_field/iso.png
      href: /projects/misc/#phase-field-solidification
      video: https://www.youtube.com/watch?v=7_Kq9U8cV-M
      tags: [Phase field, Solidification, Finite elements]
    - title: Anisotropic phase-field solidification
      description: Direction-dependent crystal growth generated by an anisotropic phase-field model.
      image: /assets/arts/phase_field/aniso.png
      href: /projects/misc/#phase-field-solidification
      video: https://www.youtube.com/watch?v=jd8pYoyqFlA
      tags: [Anisotropy, Crystal growth, Multiphysics]
